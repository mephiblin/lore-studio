services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lore_studio}
      POSTGRES_USER: ${POSTGRES_USER:-lore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lore}
    volumes:
      - lore_studio_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lore} -d ${POSTGRES_DB:-lore_studio}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - lore_studio_net

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_CONFIG_ROOT: /app/config
      MOCK_MODEL: ${MOCK_MODEL:-false}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
    volumes:
      - ./config:/app/config:ro
    command: ["/bin/sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lore_studio_net

  frontend:
    build:
      context: ./frontend
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lore_studio_net

volumes:
  lore_studio_pgdata:
    name: lore_studio_pgdata

networks:
  lore_studio_net:
    name: lore_studio_net
    driver: bridge

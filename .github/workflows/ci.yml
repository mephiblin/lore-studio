name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Python lint and tests
        run: |
          ruff check backend scripts
          pytest -q
      - name: Validate JSON Schema, YAML and Python bundle
        run: python scripts/validate_bundle.py
      - name: Frontend install and build
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Secret and large model guard
        run: |
          ! git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}'
          ! git ls-files | grep -E '\.(gguf|safetensors|ckpt|pt|pth)$'
          ! git ls-files -z | xargs -0 du -b | awk '$1 > 50000000 { print; failed=1 } END { exit failed }'

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start stack with model services unavailable
        env:
          EMBEDDING_ENABLED: 'false'
        run: |
          cp .env.example .env
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/api/v1/health
      - name: Playwright responsive UI
        run: |
          npm --prefix frontend ci
          npx --prefix frontend playwright install --with-deps chromium
          npm --prefix frontend run test:e2e
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color --tail=200

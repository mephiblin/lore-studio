key: novel_prose
version: "1.0.0"
name: 소설 장면
description: 인물의 행동과 감각, 선택의 변화를 장면으로 보여 줍니다.
recommended_recipe_keys: [novel_scene, dramatized_lore]
recommended_voice_profile_key: fiction_scene
recommended_sampling_profile: expressive
rules:
  paragraph_density: medium
  sentence_length: varied
  spoken_clarity: medium
  narrator_scope: viewpoint_bounded
  finished_manuscript_only: true
  scene_continuity: strict
  headings: false
  evidence_display: embodied
  information_selection: viewpoint_accessible_only
  exposition_mode: action_cost_or_obstacle
  temporal_access: scene_time_only
  meta_commentary: false
  state_change_required: true
  ending_mode: consequential_change
  semantic_strength_preserved: true

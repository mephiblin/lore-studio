key: personal_essay
version: "1.0.0"
name: 수필·에세이
description: 구체적인 경험과 관찰에서 생각이 움직이는 과정을 보여 줍니다.
recommended_recipe_keys: [reflective_essay, contrast_reframe]
recommended_voice_profile_key: reflective_essay
recommended_sampling_profile: expressive
rules:
  paragraph_density: medium
  sentence_length: varied
  narrator_scope: reflective
  author_knowledge: personally_accessible
  finished_manuscript_only: true
  headings: optional
  evidence_display: natural
  concrete_before_abstract: true
  generalization: bounded
  countermemory_or_exception: encouraged
  meta_commentary: false
  information_selection: experience_led
  ending_mode: changed_image_or_open_question
  semantic_strength_preserved: true

title: 구체적 경험에서 생각을 확장한다
body: |
  추상적인 주장보다 한 장면, 감각, 관찰에서 시작한다.
  경험을 곧바로 교훈으로 만들지 않고 처음 생각과 달라진 지점, 설명하기 어려운 예외를 함께 살핀다.
  결말은 정답을 선포하기보다 독자의 생각이 이어질 문장이나 이미지로 닫는다.
tags: [수필, 에세이, 성찰, 경험]
parsed_rules:
  goals:
    - 경험과 성찰을 자연스럽게 연결
    - 생각이 변하는 과정을 보여 주기
  must_include:
    - 구체적인 관찰 또는 경험
    - 처음과 달라진 시선
  avoid:
    - 경험과 무관한 상투적 교훈
    - 모든 독자에게 같은 결론을 강요
  ending_preference: 답보다 생각할 여운을 남김

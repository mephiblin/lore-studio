title: 기관은 현상을 잘못 분류한다
body: |
  공식 기관은 관찰 자료를 가지고 있지만 익숙한 분류 체계에 억지로 끼워 맞춘다.
  현장 사례가 공식 설명과 조금씩 어긋나며, 독자는 기관보다 먼저 한계를 알아차린다.
  기관을 무능한 바보로 만들지 말고 당시 증거로는 합리적인 판단이었음을 보여준다.
tags: [기관, 오해, 조사, 미스터리]
parsed_rules:
  must_include:
    - 공식 분류와 현장 관찰의 차이
    - 당시 판단이 합리적이었던 이유
  avoid:
    - 기관 전체를 단순한 악역이나 바보로 묘사
  ending_preference: 공식 결론은 유지되지만 독자에게 균열이 보임

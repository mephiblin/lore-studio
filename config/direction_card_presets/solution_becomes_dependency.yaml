title: 해결책이 사회적 의존으로 변한다
body: |
  처음에는 실제 문제를 해결하는 수단으로 등장한다. 효능은 거짓이 아니어야 한다.
  시간이 지나며 개인이나 기관이 그것을 포기할 수 없는 구조가 만들어진다.
  대가는 별도의 벌이 아니라 효능을 유지하는 동일한 메커니즘에서 발생한다.
  결말은 간단한 파괴나 봉인보다 새로운 질서로 정착하는 방향을 우선한다.
tags: [의존, 사회, 비극, 기술]
parsed_rules:
  must_include:
    - 초기 효능이 실제로 유용함
    - 포기할 수 없는 사회적 이유
  avoid:
    - 효능이 처음부터 전부 거짓이었다는 반전
    - 단순 파괴로 모든 문제가 해결됨
  sequence: [도입, 성공, 확산, 의존, 대가, 정착]
  ending_preference: 완전한 해결보다 지속되는 구조

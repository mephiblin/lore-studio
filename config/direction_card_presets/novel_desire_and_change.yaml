title: 인물의 욕망과 선택을 장면으로 보여 준다
body: |
  인물이 지금 원하는 것을 행동과 반응으로 먼저 보여 준다.
  설명은 선택을 이해하는 데 필요한 만큼만 두고, 갈등이 인물에게 실제 선택을 요구하게 한다.
  장면의 끝에는 선택 전과 달라진 관계, 감정, 상황 중 하나가 남아야 한다.
tags: [소설, 장면, 인물, 갈등]
parsed_rules:
  goals:
    - 욕망과 갈등을 행동으로 드러내기
    - 장면 전후의 변화를 만들기
  must_include:
    - 인물이 원하는 것
    - 선택의 비용 또는 망설임
  avoid:
    - 행동 없이 감정과 설정만 길게 설명
    - 우연으로 갈등을 해결
  ending_preference: 선택의 결과가 다음 장면에 영향을 남김

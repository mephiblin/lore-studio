title: 근거와 한계를 분리해 판단한다
body: |
  보고서의 질문과 판단 기준을 먼저 밝힌다.
  확인된 사실, 해석, 추정, 권고를 구분하고 각 판단이 기대는 근거를 드러낸다.
  자료가 부족한 부분은 숨기지 않으며 결론의 강도를 근거보다 높이지 않는다.
tags: [보고서, 분석, 근거, 판단]
parsed_rules:
  goals:
    - 독자가 판단 과정을 추적할 수 있게 하기
    - 불확실성과 자료 한계를 명시하기
  must_include:
    - 조사 질문 또는 목적
    - 핵심 근거와 한계
  avoid:
    - 근거 없는 단정
    - 사실과 의견을 같은 어조로 혼합
  ending_preference: 근거 범위 안의 결론과 남은 검토 과제를 제시

key: source_curation
version: "1.0.0"
name: 발췌에서 종합 해설로
description: 선정 기준에 맞는 원자료를 고르고, 짧은 실제 발췌와 자세한 의역·의미 해설을 거쳐 자료 사이의 변화와 차이를 종합합니다.
best_for: 기록 모음, 일지 해설, 인물 변화 추적, 특정 분위기나 주제를 가진 자료 추천
philosophy:
  - 원자료, 의역, 해설자의 판단을 독자가 구분할 수 있게 한다.
  - 선정한 자료마다 서로 다른 가치와 장면을 보여 주고 같은 줄거리를 반복하지 않는다.
  - 친근한 설명도 원자료의 확실성과 의미 강도를 넘지 않는다.
  - 마지막 종합은 목록을 되풀이하지 않고 자료 사이의 변화나 공통 주제를 드러낸다.
required_moves:
  - ORIENT
  - ANCHOR
  - EXEMPLIFY
  - INTERPRET
  - COMPARE
optional_moves:
  - NARROW
  - COMPLICATE
  - TURN
  - STING
planner_rules:
  - 사용자의 선정 조건을 첫 기준으로 사용하고, 조건이 없으면 장면·관점·의미가 겹치지 않는 자료를 고른다.
  - 각 자료에 식별자, 실제 제공된 짧은 인용 또는 핵심 단서, 상세 의역, 의미 해설을 배치한다.
  - 직접 인용 evidence는 원문이 제공된 자료에만 연결하고 간접화법을 따옴표로 재구성하지 않는다.
  - 의역은 사건 순서와 인물의 행동 결과를 보존하고 자료 밖의 장면을 채우지 않는다.
  - 마지막 비교는 시간에 따른 변화, 공통 주제, 서로 다른 관점 중 근거가 충분한 하나를 선택한다.
  - 해설은 기록된 사실의 차이·공백·확실성 수준을 설명한다. 숨은 원인이나 기관의 의도를 새로 제안하는 자리가 아니다.
  - ‘가능성’, ‘시사한다’, ‘~라기보다’ 같은 완곡어도 출처 없는 가설을 허용하지 않는다. 가설이 필요하면 자료가 직접 제시한 후보만 다룬다.
style_defaults:
  information_density: medium
  evidence_visibility: quote_paraphrase_commentary
  narrator_relation: knowledgeable_and_conversational
  ending: cross_source_synthesis
audit_rules:
  - 따옴표 속 문구가 선택 자료에 실제로 존재하는지 확인한다.
  - 각 항목에서 의역과 해설자의 판단이 구분되는지 확인한다.
  - 기록의 공백이 실종·은폐·초자연적 원인의 증거로 강화되지 않았는지 확인한다.
  - ‘갈무리하려 했다’, ‘축소하려 했다’, ‘숨기려 했다’처럼 기록 주체의 의도를 근거 없이 부여하지 않았는지 확인한다.
  - 단순 누락과 미확정을 ‘경계 상태’, ‘이상 현상’, ‘숨은 원인’의 가능성으로 바꾸지 않았는지 확인한다.
  - 마지막 종합이 각 항목의 요약을 반복하지 않고 관계를 새로 보여 주는지 확인한다.

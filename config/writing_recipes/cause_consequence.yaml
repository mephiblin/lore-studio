key: cause_consequence
version: "1.0.0"
name: 원인에서 파급으로
description: 일이 시작된 원인과 작동 원리를 설명한 뒤, 개인의 변화에서 사회 전체의 파급으로 범위를 넓힙니다.
best_for: 재난, 저주, 제도, 기술처럼 하나의 원인이 여러 층위에 영향을 주는 소재
philosophy:
  - 원인과 결과 사이의 작동 과정을 생략하지 않는다.
  - 추상적인 영향 뒤에는 구체적인 사람·장소·사건의 변화를 둔다.
  - 파급 범위를 넓힐 때 같은 결과를 크기만 바꿔 반복하지 않는다.
required_moves:
  - ORIENT
  - ANCHOR
  - EXEMPLIFY
  - ESCALATE
  - INTERPRET
optional_moves:
  - COMPLICATE
  - WITHHOLD
  - STING
planner_rules:
  - 자료가 상관관계만 말한다면 원인으로 단정하지 않는다.
  - 작동 과정에 근거가 없으면 미지 또는 가설임을 표시한다.
  - 개인 사례와 사회적 파급에 각각 근거를 배치한다.
  - 결과의 규모를 넓힐 때 자료가 실제로 보여 주지 않은 생태계·사회 전체의 변화를 만들지 않는다.
  - 관찰된 동사의 강도를 유지하고, 작동 과정이 빈 곳은 별도 미지 블록으로 남긴다.
style_defaults:
  information_density: high
  causal_order: explicit
  scale_progression: individual_to_society
audit_rules:
  - 원인과 결과 사이에 설명되지 않은 비약이 있는지 확인한다.
  - 파급의 각 단계가 서로 다른 변화를 보여 주는지 확인한다.
  - 상관관계와 시간적 선후를 원인으로 오인하지 않았는지 확인한다.
  - 작은 관찰을 죽음·붕괴·전염 같은 큰 결과로 확대하지 않았는지 확인한다.

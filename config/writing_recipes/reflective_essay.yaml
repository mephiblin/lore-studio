key: reflective_essay
version: "1.0.0"
name: 경험에서 통찰로
description: 구체적인 경험이나 관찰에서 시작해 그 의미를 성찰하고, 쉽게 결론내릴 수 없는 지점을 거쳐 달라진 시선으로 마무리합니다.
best_for: 수필, 에세이, 회고, 여행기처럼 경험과 생각의 변화를 함께 보여 주는 글
philosophy:
  - 추상적인 주장보다 구체적인 경험이나 관찰을 먼저 둔다.
  - 성찰은 경험을 되풀이해 설명하지 않고 그 의미가 어떻게 달라졌는지 보여 준다.
  - 교훈을 강요하기보다 독자가 함께 생각할 틈을 남긴다.
required_moves:
  - ANCHOR
  - INTERPRET
  - COMPLICATE
  - TURN
  - STING
optional_moves:
  - ORIENT
  - COMPARE
  - EXEMPLIFY
  - WITHHOLD
planner_rules:
  - 첫 블록에는 독자가 볼 수 있는 경험, 장면, 관찰 중 하나를 둔다.
  - 개인 경험을 곧바로 보편적 진리로 확대하지 않고 예외나 망설임을 검토한다.
  - 관점 전환은 갑작스러운 교훈이 아니라 앞선 경험에서 이어지게 한다.
  - 회고자가 직접 본 것, 나중에 정상적으로 알게 된 것, 현재의 해석을 서로 다른 근거로 둔다.
  - 다른 사람의 비공개 기록과 미래 사실을 회고자의 기억에서 제외한다.
  - 처음의 사물이나 장면이 결말에서 달라진 의미를 갖도록 회수한다.
style_defaults:
  information_density: medium
  reflection_ratio: high
  ending: open_resonance
audit_rules:
  - 경험과 성찰이 서로 다른 내용을 맡고 있는지 확인한다.
  - 결말이 상투적인 교훈이나 앞 내용의 요약으로 끝나지 않았는지 확인한다.
  - 개인 경험을 모두에게 적용되는 진리로 확대하지 않았는지 확인한다.
  - 회고자의 접근 범위를 벗어난 자료가 성찰의 근거로 쓰이지 않았는지 확인한다.

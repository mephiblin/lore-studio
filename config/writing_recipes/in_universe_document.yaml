key: in_universe_document
version: "1.0.0"
name: 인-유니버스 문서형
description: 세계 내부의 작성자·기관·목적·편견이 드러나는 기록물로 작성한다.
philosophy:
  - 문서 작성자가 왜 이 기록을 남기는지 명확히 한다.
  - 기록의 누락·검열·오해도 세계관 정보의 일부로 사용한다.
  - 독자는 작성자보다 더 많은 것을 추론할 수 있어야 한다.
required_moves:
  - DOCUMENT_CONTEXT
  - OBSERVATION
  - INSTITUTIONAL_INTERPRETATION
  - PROCEDURE_OR_DECISION
optional_moves:
  - REDACTION
  - CONTRADICTION
  - APPENDIX
  - FINAL_NOTE
moves:
  - id: DOCUMENT_CONTEXT
    purpose: 작성자, 수신자, 목적, 날짜·등급 등 문서 상황을 세운다.
  - id: OBSERVATION
    purpose: 관찰·증거·증언을 기록한다.
  - id: INSTITUTIONAL_INTERPRETATION
    purpose: 기관이 증거를 어떻게 분류하고 이해하는지 보여준다.
  - id: PROCEDURE_OR_DECISION
    purpose: 격리·처분·배치·재판 등 문서가 요구하는 행동을 제시한다.
  - id: REDACTION
    purpose: 삭제·검열·접근 제한을 통해 권력과 미지를 드러낸다.
  - id: CONTRADICTION
    purpose: 공식 결론과 증거 사이의 균열을 남긴다.
  - id: FINAL_NOTE
    purpose: 후일 추가된 짧은 기록으로 문서의 안전성을 뒤집는다.
planner_rules:
  - 작성자가 알 수 없는 전지적 사실을 쓰지 않는다.
  - 문서 형식 장식이 정보 전개를 압도하지 않게 한다.
  - 검열은 빈칸 남발이 아니라 의미 있는 누락에 사용한다.
style_defaults:
  narrator: in_world_author
  information_density: high
  tone: institutional
  bias_visible: true
audit_rules:
  - 작성자의 지식 범위를 벗어난 문장이 있는지 확인한다.
  - 보고서 용어만 늘어놓고 사건의 의미가 사라지지 않았는지 확인한다.

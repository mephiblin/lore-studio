key: novel_scene
version: "1.0.0"
name: 목표에서 결과로
description: 원하는 것을 먼저 세우고 방해와 압박을 높인 뒤, 선택이 어떤 결과를 만드는지 따라갑니다.
best_for: 인물의 선택, 세력 간 충돌, 작전과 실패처럼 행동의 인과가 중요한 소재
pattern_preview:
  - 목표
  - 방해
  - 선택
  - 결과
philosophy:
  - 독자가 무엇을 이루려는지 먼저 이해하게 한다.
  - 갈등은 목표를 어렵게 만드는 방향으로 단계적으로 강화한다.
  - 결과는 우연이 아니라 앞선 선택에서 이어지게 한다.
required_moves:
  - ANCHOR
  - COMPLICATE
  - ESCALATE
  - TURN
  - INTERPRET
optional_moves:
  - ORIENT
  - EXEMPLIFY
  - STING
moves:
  - id: ANCHOR
    purpose: 인물·집단·제도가 지금 원하는 목표와 이유를 분명히 한다.
  - id: COMPLICATE
    purpose: 목표를 어렵게 만드는 첫 장애와 이해관계의 충돌을 제시한다.
  - id: ESCALATE
    purpose: 대가와 시간 압박을 키워 선택을 피할 수 없게 한다.
  - id: TURN
    purpose: 선택 또는 결정으로 상황의 방향을 바꾼다.
  - id: INTERPRET
    purpose: 선택의 직접 결과와 이후 세계에 남은 변화를 설명한다.
planner_rules:
  - 핵심 목표는 하나로 유지하고 부차적인 갈등이 이를 가리지 않게 한다.
  - 선택 전에 선택의 대가가 무엇인지 독자가 알 수 있게 한다.
  - 결과는 선택과 연결된 자료 근거를 사용한다.
style_defaults:
  information_density: medium
  causal_continuity: strict
  tension_curve: rising
audit_rules:
  - 목표와 최종 결과 사이의 인과가 끊기지 않았는지 확인한다.
  - 압박이 같은 형태로 반복되기만 하지 않았는지 확인한다.

key: field_lore_warning
version: "1.0.0"
name: 현장 징후에서 경고로
description: 화자와 청자를 정한 뒤 목격한 흔적과 전해 들은 단서를 구분하고, 위험의 징후를 거쳐 구체적인 경고·거래·행동으로 마칩니다.
best_for: 세계 내부 소문, 현장 증언, 생존 조언, 위험한 대상의 구술 설명
philosophy:
  - 화자가 알 수 있는 정보만 고르고 목격과 전언과 추측을 같은 확신으로 말하지 않는다.
  - 설정을 목록처럼 나열하지 않고 행동·감각·침묵·손실의 흔적으로 보여 준다.
  - 마지막은 해설이 아니라 화자가 청자에게 주는 실질적인 경고나 선택이다.
required_moves:
  - ORIENT
  - ANCHOR
  - EXEMPLIFY
  - WITHHOLD
  - ESCALATE
  - STING
optional_moves:
  - COMPLICATE
  - TURN
planner_rules:
  - 화자·청자·말하는 장소·화자의 욕망을 원고 안에서 설득력 있게 드러낼 수 있도록 정한다.
  - 주요 정보마다 직접 목격, 출처가 있는 전언, 화자의 추측 중 어떤 경로인지 분명히 구분한다.
  - 화자가 그 장소와 신분에서 알 수 없는 정보는 빼고, 고유명사를 전부 나열하지 않는다.
  - 추상적 해석은 신체 반응, 소리, 냄새, 온도, 촉감, 행동, 침묵, 손실 중 확인 가능한 현상으로 바꿔 계획한다.
  - 결말은 구체적인 경고, 거래 조건, 또는 행동으로 정하고 메타 평가로 닫지 않는다.
style_defaults:
  information_density: selective
  certainty_visible: true
  ending_mode: warning_trade_or_action
audit_rules:
  - 주요 주장에 화자가 믿을 만한 지식 경로가 있는지 확인한다.
  - 공개 유보 정보와 추측이 확정 사실로 바뀌지 않았는지 확인한다.
  - 마지막 이동이 메타 설명이나 자문이 아니라 구체적인 경고·거래·행동인지 확인한다.

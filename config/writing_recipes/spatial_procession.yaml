key: spatial_procession
version: "1.0.0"
name: 공간 순례에서 귀결로
description: 밖과 안의 대조를 세우고, 질서 있는 공간을 통과하며 같은 신호로 반복해 중단한 뒤 세계의 규칙이 깨지는 순간에 빠르게 귀결합니다.
best_for: 상징적 공간, 의례와 축제, 집단의 오만과 불안, 반복 신호가 있는 고딕 우화
philosophy:
  - 상징의 뜻을 정의하지 말고 공간의 배치와 집단의 반응으로 체감시킨다.
  - 반복 신호의 물리적 특성은 바꾸지 않고, 그에 대한 집단의 반응만 변화시킨다.
  - 귀결은 설명이 아니라 이미 세운 규칙의 물리적 붕괴로 보여 준다.
required_moves:
  - ORIENT
  - ANCHOR
  - ESCALATE
  - TURN
  - STING
optional_moves:
  - WITHHOLD
  - COMPLICATE
  - SYNTHESIZE
planner_rules:
  - ORIENT에서 밖의 위험과 안의 안전이라는 집단의 믿음을 대조시킨다.
  - ANCHOR에서 독자가 순서를 따라갈 수 있게 공간의 문턱과 이동 방향을 고정한다.
  - 반복 신호는 한 문장으로 정의하여 must_include에 넣고, 모든 반복에서 소리·밝기·지속·발원의 특성을 변경하지 않는다.
  - ESCALATE에서는 신호가 아니라 집단의 정지 시간·반응·회복 방식만 단계적으로 변화시킨다.
  - TURN에서 인물이 묻지 않은 증거나 장면 이후의 정보를 가져오지 않고, 기존 공간 규칙 하나가 깨지게 한다.
  - STING은 상징을 해설하지 말고 짧은 물리적 결과와 마지막 이미지로 끝낸다.
  - STING의 must_include에는 마지막 물리적 이미지만 두고, 미확정 원인·이후 상황·의미 정리는 avoid에 둔다.
style_defaults:
  information_density: medium
  temporal_order: continuous_procession
  abstract_to_concrete: concrete_only
audit_rules:
  - 반복 신호의 물리적 특성이 재등장할 때마다 바뀌지 않았는지 확인한다.
  - 선택한 근거와 장면 시간 밖의 사실이 새 설정으로 추가되지 않았는지 확인한다.
  - ‘이것은 ~를 상징한다’처럼 상징의 뜻을 본문이 직접 설명하지 않았는지 확인한다.
  - 참고 작가의 고유명·유명한 문구·특정 소품을 복제하지 않고 구조적 원리만 사용했는지 확인한다.
  - 시작의 공간 규칙과 집단의 믿음이 마지막 물리적 결과와 연결되는지 확인한다.

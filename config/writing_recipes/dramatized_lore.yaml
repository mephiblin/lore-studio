key: dramatized_lore
version: "1.0.0"
name: 현재 흔적에서 과거로
description: 지금 남은 흔적을 먼저 보여 준 뒤, 그 흔적을 만든 과거의 변화와 현재의 의미를 역순으로 밝혀 갑니다.
best_for: 장소의 폐허, 괴물의 기원, 오래된 사건처럼 현재 모습에 과거가 남아 있는 소재
philosophy:
  - 현재 독자가 확인할 수 있는 흔적을 출발점으로 삼는다.
  - 과거는 현재의 모습이 생긴 이유를 설명하는 범위에서만 복원한다.
  - 마지막에는 처음의 흔적을 다시 보되 의미가 달라지게 한다.
required_moves:
  - ANCHOR
  - ORIENT
  - COMPLICATE
  - ESCALATE
  - TURN
optional_moves:
  - EXEMPLIFY
  - WITHHOLD
  - STING
planner_rules:
  - 현재에서 과거로 이동하는 시점을 독자가 혼동하지 않게 표시한다.
  - 자료에 없는 고유명사와 정밀한 수치를 과거 복원에 임의로 추가하지 않는다.
  - 과거 설명은 처음 제시한 현재의 흔적과 반드시 연결한다.
  - 후대의 해석을 과거 인물이 알고 있던 사실처럼 장면에 가져오지 않는다.
  - 감각적 극화는 자료가 확인한 상태와 결과의 강도를 넘지 않는다.
style_defaults:
  information_density: medium
  temporal_order: reverse_then_return
  abstract_to_concrete: alternating
audit_rules:
  - 과거의 극화가 새로운 정사처럼 보이는 사실을 만들지 않았는지 확인한다.
  - 처음과 마지막의 현재 흔적이 의미 있게 연결되는지 확인한다.
  - 서로 다른 시점의 지식이 한 인물이나 기록자에게 합쳐지지 않았는지 확인한다.
  - 떠오름을 죽음으로, 떠남을 실종으로 바꾸는 극화가 없는지 확인한다.

key: contrast_reframe
version: "1.0.0"
name: 통념에서 재해석으로
description: 널리 알려진 믿음이나 첫인상을 세운 뒤, 반대 사례와 예외를 보여 주며 대상의 의미를 다시 해석합니다.
best_for: 오해받는 인물, 양면적인 제도, 선악이 단순하지 않은 사건이나 세력
philosophy:
  - 통념을 일부러 어리석게 만들지 않고 실제로 설득력 있는 이유를 보여 준다.
  - 반대 사례는 억지 반전이 아니라 기존 설명이 놓친 조건을 드러내야 한다.
  - 마지막 해석은 선악을 뒤집는 데 그치지 않고 두 관점을 함께 설명한다.
required_moves:
  - ORIENT
  - ANCHOR
  - COMPARE
  - COMPLICATE
  - TURN
optional_moves:
  - EXEMPLIFY
  - INTERPRET
  - STING
planner_rules:
  - 초반 통념과 후반 재해석에 모두 자료 근거를 사용한다.
  - 단순한 선악 반전이나 충격을 위한 비밀 폭로로 끝내지 않는다.
  - 재해석 이후 처음의 통념이 왜 불완전했는지 설명한다.
style_defaults:
  information_density: medium
  contrast_visibility: high
  ending: reframed
audit_rules:
  - 반대 사례가 앞의 통념과 실제로 충돌하는지 확인한다.
  - 재해석이 앞서 제시한 근거를 버리지 않고 통합하는지 확인한다.

key: progressive_exposition
version: "1.0.0"
name: 큰 맥락에서 핵심으로
description: 넓은 세계의 맥락에서 출발해 핵심 대상으로 초점을 좁히고, 사례와 예외를 거쳐 의미를 정리합니다.
best_for: 지역, 제도, 종족, 기술처럼 처음 접하는 설정을 이해하기 쉽게 소개하는 글
philosophy:
  - 소재별 고정 목차가 아니라 정보 공개 순서와 확실성의 변화를 설계한다.
  - 현상과 결과는 구체적으로, 근본 원인은 자료가 허용하는 범위까지만 설명한다.
  - 추상적인 설정 뒤에는 개인·사건·사물의 구체적 결과를 배치한다.
  - 독자가 충분히 이해한 뒤에도 세계가 완전히 닫히지 않게 한다.
required_moves:
  - ORIENT
  - NARROW
  - ANCHOR
  - COMPLICATE
  - INTERPRET
optional_moves:
  - COMPARE
  - EXEMPLIFY
  - ESCALATE
  - WITHHOLD
  - TURN
  - STING
planner_rules:
  - 넓은 맥락은 대상 이해에 필요한 만큼만 사용하고 과시적 배경 설명을 피한다.
  - 추상 문단이 두 개 연속되면 다음 블록에 EXEMPLIFY를 우선한다.
  - 확정 사실, 보고, 해석, 미지를 같은 어조로 쓰지 않는다.
  - COMPLICATE는 억지 반전이 아니라 기존 설명의 한계를 보여줘야 한다.
  - 결말은 앞 내용을 요약하지 말고 의미의 범위 또는 미해결 문제를 남긴다.
  - 모든 글에 WITHHOLD를 강제하지 않는다. 자료가 확정한 것은 분명히 말한다.
  - 자료의 침묵은 확인 불가로 남기고 의도·범죄·비밀의 증거로 자동 변환하지 않는다.
  - 관찰된 결과의 동사와 규모를 유지하며 사회·생태 전체로 확대할 때 별도 근거를 요구한다.
style_defaults:
  narrator: external_archivist
  knowledge: broad_but_incomplete
  information_density: high
  sentence_rhythm: long_explanation_then_short_decision
  abstract_to_concrete: required
  explicit_judgment: low
audit_rules:
  - 설정을 항목식으로 나열했는지 확인한다.
  - 설명의 스케일이 한 수준에만 머물렀는지 확인한다.
  - 미지를 상투적인 표현으로만 처리했는지 확인한다.
  - 같은 반전과 종결 문구를 반복했는지 확인한다.
  - 떠오름·떠남·누락·이동의 의미가 죽음·실종·은폐·회수로 강화되지 않았는지 확인한다.

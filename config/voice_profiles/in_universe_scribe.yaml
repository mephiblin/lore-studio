key: in_universe_scribe
version: "1.0.0"
name: 세계 내부 기록자 문체
description: 작성자의 직무·시대·목적과 접근 가능한 증거 안에서 실제 기록물처럼 씁니다.
profile_json:
  reader_effect: 문서의 정보뿐 아니라 작성자의 한계와 기관적 이해관계를 문구와 누락에서 읽게 한다.
  sentence_rhythm:
    - 작성자의 교육·직업·문서 목적에 맞는 문장 길이와 반복 양식을 유지한다.
    - 긴 기록 뒤에는 조치·요청·판단을 명료하게 둔다.
  description_rules:
    - 작성자가 직접 본 손상, 세어 본 물건, 들은 증언과 취한 조치를 중심으로 쓴다.
    - 다른 사람의 비공개 기록과 미래 사실을 작성자의 지식으로 가져오지 않는다.
  dialogue_rules:
    - 증언을 옮길 때 직접 인용과 요약 보고를 구분한다.
  figurative_language:
    - 시대와 직무에 어울리는 비유만 제한적으로 사용한다.
  paragraph_rules:
    - 문서 목적에 필요한 관찰·판단·조치만 선택한다.
    - 날짜·결재란·수신자 같은 외형은 자료나 요청이 허용할 때만 둔다.
  avoid_patterns:
    - 세계 밖 독자를 위한 설정 해설
    - 근거 없는 날짜·직함·기관 세부
    - 기록자가 알 수 없는 속내와 비밀의 정답
    - 메모 전체를 보고서 항목으로 복사
  best_for: [편지, 일지, 조사 기록, 보고서, 포고문]
  audit_rules:
    - 작성자가 각 정보를 어떻게 알았는지 확인한다.
    - 문서 시점 이후의 사실이 들어오지 않았는지 확인한다.
    - 결말이 세계 밖 설명이 아니라 문서 목적에 맞는 행위인지 확인한다.
  compatibility:
    viewpoints: [first_observer]
    tenses: [present, past]

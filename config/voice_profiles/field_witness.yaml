key: field_witness
version: "1.0.0"
name: 현장 증언 문체
description: 한 화자의 신분과 지식 범위 안에서 목격·전언·추측을 구분하고 현장 감각으로 전달합니다.
profile_json:
  reader_effect: 청자가 제한된 증언자의 눈과 귀를 빌려 현장을 겪고, 믿을 정보와 숨겨진 부분을 스스로 가린다.
  sentence_rhythm:
    - 화자의 신분·나이·직업·감정에 맞는 말의 호흡과 어휘를 유지한다.
    - 위험이 가까워질수록 짧은 판단과 구체적 반응으로 호흡을 조임한다.
  description_rules:
    - 추상적 의미를 행동, 소리, 냄새, 온도, 촉감, 신체 반응의 확인 가능한 현상으로 바꿔 보여 준다.
    - 화자가 보지 못한 장면과 알 수 없는 속마음을 전지적으로 설명하지 않는다.
  dialogue_rules:
    - 화자가 청자에게 이어 말하는 직접적 목소리를 유지한다.
    - 목격한 일, 남에게 들은 일, 자신의 추측을 말투와 근거로 구분한다.
  figurative_language:
    - 세계 안의 화자가 자연스럽게 쓸 비유만 사용하고, 작가의 현대적 분석 어휘를 겹쳐 쓰지 않는다.
  paragraph_rules:
    - 메모의 항목명을 따라가지 않고 화자의 기억과 판단이 이어지는 흐름으로 문단을 조직한다.
    - 각 문단은 새 흔적, 불확실성, 대가, 행동 중 하나를 앞으로 전진시킨다.
  avoid_patterns:
    - 반복되는 호칭과 수사 의문문
    - 결론을 따로 정리하는 메타 발언
    - 세계 밖 현대의 분석·제품·시스템 어휘
    - 메모 표제와 작성자의 추상적 해석을 그대로 복사
    - 고유명사와 확정 사실의 백과사전식 나열
  best_for:
    - 세계 내부 구술
    - 현장 증언
    - 소문과 생존 조언
    - 제한된 화자의 경고
  audit_rules:
    - 주요 정보가 화자의 신분과 경험으로 알 수 있는 것인지 확인한다.
    - 문장의 주어·동작·공간 관계가 실제 장면처럼 이어지는지 확인한다.
    - 확정된 고유명사와 설정은 보존하되 전체 자료를 나열하지 않았는지 확인한다.
  compatibility:
    viewpoints: [first_observer, third_limited]
    tenses: [present, past]

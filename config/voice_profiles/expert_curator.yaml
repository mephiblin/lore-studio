key: expert_curator
version: "1.0.0"
name: 친근한 전문 해설 문체
description: 원자료·의역·해설을 구분하면서 독자와 대화하듯 핵심 장면과 의미를 짚습니다.
profile_json:
  reader_effect: 원자료를 직접 읽지 않은 독자도 사건 흐름과 자료마다 다른 가치, 전체 변화까지 이해한다.
  sentence_rhythm:
    - 상세 의역 사이에 짧은 판단이나 반전을 선택적으로 둔다.
    - 모든 항목을 같은 길이와 같은 결론 문구로 만들지 않는다.
  description_rules:
    - 직접 인용, 자세한 의역, 해설자의 분석이 바뀌는 지점을 분명히 한다.
    - 간접화법을 직접 인용으로 재구성하지 않고 원자료의 사건 순서와 의미를 보존한다.
    - 원자료의 공백을 인물의 운명이나 권력자의 의도로 확정하지 않는다.
  dialogue_rules: []
  figurative_language:
    - 아이러니와 블랙유머는 원자료가 실제로 뒷받침할 때만 짚는다.
  paragraph_rules:
    - 각 항목은 식별자, 핵심 발췌 또는 단서, 상세 의역, 의미 해설의 흐름을 갖는다.
    - 전체 끝에서는 항목을 관통하는 변화나 차이를 종합한다.
  avoid_patterns:
    - 제공되지 않은 원문·기록 번호·출처를 창작
    - 모든 항목에 굉장히·진짜·충격적 같은 과장어 반복
    - 줄거리만 길게 옮기고 의미를 설명하지 않기
    - 요청하지 않은 다음 콘텐츠 홍보
  best_for: [자료 큐레이션, 기록 해설, 인물 변화 추적, 팬덤형 소개 글]
  audit_rules:
    - 따옴표 속 문구가 제공된 원문 또는 명시된 번역인지 확인한다.
    - 의역과 해설자의 판단이 독자에게 구분되는지 확인한다.
    - 종합 문단이 단순 순위 재진술을 넘어서는지 확인한다.
  compatibility:
    viewpoints: [omniscient, first_observer]
    tenses: [present, past]

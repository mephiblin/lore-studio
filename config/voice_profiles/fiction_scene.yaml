key: fiction_scene
version: "1.0.0"
name: 장면 중심 소설 문체
description: 설명보다 행동·감각·대화로 인물의 욕망과 변화를 체감하게 합니다.
profile_json:
  reader_effect: 장면 안에서 인물의 욕망과 감각을 따라가며 변화의 순간을 체감한다.
  sentence_rhythm:
    - 행동 순간에는 짧은 문장, 관찰과 여운에는 중간 길이 문장을 쓴다.
    - 같은 길이와 구조의 문장을 세 번 이상 연속하지 않는다.
  description_rules:
    - 시점 인물이 지금 알아차릴 감각과 사물만 우선한다.
    - 설정 설명은 행동의 장애물이나 선택의 비용과 연결한다.
    - 시점 인물이 장면 시점까지 접하지 못한 기록과 미래 사실을 묘사에 사용하지 않는다.
  dialogue_rules:
    - 대사는 이미 아는 정보를 서로 설명하는 용도로 쓰지 않는다.
    - 말과 행동 또는 속마음 사이에 의미 있는 차이를 둔다.
    - 대사마다 얻으려는 것, 숨기는 것, 피하려는 것 중 하나를 둔다.
  figurative_language:
    - 한 장면의 핵심 이미지 계열을 유지하고 비유를 남발하지 않는다.
  paragraph_rules:
    - 행동, 반응, 결과가 읽히도록 문단의 초점을 하나로 유지한다.
    - 위치·시선·손에 든 물건과 직전 동작을 다음 문단까지 추적한다.
  avoid_patterns:
    - 감정을 이름으로만 반복 설명
    - 장면을 멈추는 세계관 백과식 설명
    - 배경 자료 전체를 인물의 기억으로 옮기는 회상
    - 장면 이후의 역사와 결과를 미리 요약
  best_for: [소설 장면, 인물 갈등, 행동, 대화]
  audit_rules:
    - 시점 인물이 알 수 없는 정보가 끼어들지 않았는지 확인한다.
    - 장면 전후에 인물이나 상황의 변화가 있는지 확인한다.
    - 인물의 정보 접근 범위와 장면의 시간 경계가 지켜졌는지 확인한다.
    - 자료의 관찰을 죽음·실종·음모로 강화하지 않았는지 확인한다.
  compatibility:
    viewpoints: [first_observer, third_limited]
    tenses: [present, past]

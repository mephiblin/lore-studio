key: ceremonial_gothic
version: "1.0.0"
name: 의례적 고딕 이야기꾼
description: 전지적이되 설명에 머물지 않고, 질서 있는 공간·집단의 움직임·절제된 의인화로 의례적인 불길함을 만듭니다.
profile_json:
  reader_effect: 독자가 상징을 풀이듣 읽기보다 공간의 질서와 붕괴를 악몽처럼 지나가게 한다.
  sentence_rhythm:
    - 공간의 순서와 집단의 움직임은 중첩되는 긴 문장으로 쌓는다.
    - 반복 신호와 규칙이 깨지는 순간은 짧고 단정한 문장으로 끊는다.
  description_rules:
    - 색·질감·배치·거리·소리를 독자가 공간을 통과하는 순서대로 배치한다.
    - 집단은 개인의 심리 설명보다 한께 멈추고 흐트러지고 다시 움직이는 모습으로 보여 준다.
    - 사물과 공간의 의인화는 하나의 이미지 계열로 제한한다.
  dialogue_rules:
    - 대사는 거의 사용하지 않고, 필요할 때도 집단의 확신이나 규칙의 붕괴를 드러내는 짧은 문장만 쓴다.
  figurative_language:
    - 비유는 색채·시간·경계 중 한 계열을 선택하고 섞지 않는다.
    - 상징의 뜻을 해설하는 대신 동일한 사물이 다른 상황에서 다시 보이게 한다.
  paragraph_rules:
    - 한 문단에서는 한 공간·한 집단 반응·한 규칙 변화만 다룬다.
    - 마지막 문단은 의미를 정리하지 않고 물리적 결과와 하나의 이미지로 짧게 닫는다.
  avoid_patterns:
    - 이것은 ~를 상징한다는 직접 해설
    - 사전식 정의로 시작하는 도입
    - 고딕·음산·기괴를 반복하는 범용 형용사
    - 참고 작가의 이름·작품명·유명한 문구·고유한 소품 복제
    - 화자가 독자에게 상징의 정답을 강의하는 결론
  best_for: [상징적 우화 단편, 고딕 서사, 의례적 공간, 집단 군상]
  audit_rules:
    - 반복 신호의 형태는 고정되고 그에 대한 반응만 변했는지 확인한다.
    - 공간의 배치와 이동 순서가 독자에게 읽히는지 확인한다.
    - 상징을 직접 정의하거나 참고 작품의 고유 장치를 복제하지 않았는지 확인한다.
    - 종결이 설명을 추가하지 않고 이미 세운 규칙의 물리적 결과로 끝나는지 확인한다.
  compatibility:
    viewpoints: [omniscient]
    tenses: [past, present]

key: analytical_report
version: "1.0.0"
name: 근거 중심 보고서 문체
description: 사실·해석·결론의 층위를 분리하고 판단 근거와 한계를 분명히 드러냅니다.
profile_json:
  reader_effect: 핵심 판단과 그 근거, 불확실성의 범위를 빠르게 파악하게 한다.
  sentence_rhythm:
    - 한 문장에는 하나의 핵심 판단만 둔다.
    - 긴 설명 뒤에는 요점이나 조건을 짧게 정리한다.
    - 동일한 접속어와 명사형 종결을 연속해 보고서 호흡을 기계적으로 만들지 않는다.
  description_rules:
    - 수치와 고유 사실에는 출처가 되는 선택 자료를 연결한다.
    - 관찰, 해석, 권고를 같은 표현으로 섞지 않는다.
    - 자료의 동사와 수식어보다 강한 결과를 새로 붙이지 않는다.
  dialogue_rules: []
  figurative_language:
    - 의미를 흐리는 장식적 비유를 피한다.
  paragraph_rules:
    - 문단 첫 문장에 쟁점 또는 판단을 두고 뒤에서 근거와 한계를 설명한다.
    - 대안 설명을 제시한 문단은 그 설명을 가를 추가 근거까지 밝힌다.
  avoid_patterns:
    - 근거 없는 확신 표현
    - 같은 결론의 반복
    - 모호한 주어와 책임 회피형 문장
    - 기록의 누락을 곧바로 은폐의 증거로 단정
    - 떠남을 실종으로, 증상을 변이로 강화하는 표현
  best_for: [분석 보고서, 조사 보고서, 검토 의견, 브리핑]
  audit_rules:
    - 모든 주요 결론이 앞선 근거와 연결되는지 확인한다.
    - 자료가 없는 부분을 사실처럼 단정하지 않았는지 확인한다.
    - 결론이 가능한 가장 낮은 충분 강도로 쓰였는지 확인한다.
    - 원자료의 의미 강도가 보존됐는지 확인한다.
  compatibility:
    viewpoints: [omniscient, first_observer]
    tenses: [present, past]
